[package]
name = "uvie-host"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Platform-independent host policy for UVie input methods: key dispatch, macros, per-app memory"
license = "MIT OR Apache-2.0"
repository = "https://github.com/uvie-project/uvie-rs"
publish = false

[dependencies]
uvie = { path = "../..", version = "2.8.3" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
